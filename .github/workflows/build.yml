name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  # 工具输出含大量中文；runner 默认代码页是 cp1252，不设 UTF-8 会打印乱码。
  # 代码侧另有 wbswitch.console 兜底（装不下的字符退化而不是崩），这里是双保险。
  PYTHONIOENCODING: utf-8

jobs:
  # ---------------------------------------------------------------
  # 基础检查：语法、导入、CLI 能起来（不需要 WorkBuddy 环境）
  # ---------------------------------------------------------------
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 语法检查
        run: python -m compileall -q wbswitch app.py

      - name: 导入与 CLI 冒烟测试
        shell: bash
        run: |
          # 用沙箱环境变量，避免读真实 WorkBuddy 数据
          export WBSWITCH_SANDBOX=1
          export WBSWITCH_STORE="$RUNNER_TEMP/store"
          export WBSWITCH_WORKBUDDY_HOME="$RUNNER_TEMP/wb"
          export WBSWITCH_AUTH_DIR="$RUNNER_TEMP/auth"
          mkdir -p "$WBSWITCH_STORE" "$WBSWITCH_WORKBUDDY_HOME" "$WBSWITCH_AUTH_DIR"
          python -c "import wbswitch.cli, wbswitch.gui, wbswitch.engine, wbswitch.sessions, wbswitch.switcher; print('imports ok')"
          python -m wbswitch.cli --version
          python -m wbswitch.cli state || true
          python -m wbswitch.cli sessions || true
          python -m wbswitch.cli diagnose || true

      - name: i18n 键一致性
        run: python tools/check_i18n.py

  # ---------------------------------------------------------------
  # 独立版引擎 exe（单文件，含 tkinter 图形界面）
  # ---------------------------------------------------------------
  build-exe:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 PyInstaller
        run: python -m pip install --upgrade pyinstaller pillow

      - name: 生成图标
        run: python tools/make_icon.py

      - name: 打包
        run: python -m PyInstaller build.spec --noconfirm --clean

      - name: 冒烟测试（命令行模式）
        shell: bash
        run: |
          export WBSWITCH_SANDBOX=1
          export WBSWITCH_STORE="$RUNNER_TEMP/store"
          export WBSWITCH_WORKBUDDY_HOME="$RUNNER_TEMP/wb"
          export WBSWITCH_AUTH_DIR="$RUNNER_TEMP/auth"
          mkdir -p "$WBSWITCH_STORE" "$WBSWITCH_WORKBUDDY_HOME" "$WBSWITCH_AUTH_DIR"
          ./dist/WorkBuddySwitch.exe --version
          ./dist/WorkBuddySwitch.exe sessions

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: WorkBuddySwitch-exe
          path: dist/WorkBuddySwitch.exe
          if-no-files-found: error

      - name: 发布 Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WorkBuddySwitch.exe
          generate_release_notes: true
          draft: false

  # ---------------------------------------------------------------
  # 桌面应用 SwitchSuite（Tauri 2，源码在 desktop/）
  # 侧车不进仓库：从本仓库根的引擎源码现场构建
  # ---------------------------------------------------------------
  build-desktop:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装 PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: 生成图标
        run: python tools/make_icon.py

      - name: 构建引擎侧车（onedir）
        run: python -m PyInstaller build-sidecar.spec --noconfirm --clean

      - name: 冒烟测试侧车
        shell: bash
        run: |
          export WBSWITCH_SANDBOX=1
          export WBSWITCH_STORE="$RUNNER_TEMP/store"
          export WBSWITCH_WORKBUDDY_HOME="$RUNNER_TEMP/wb"
          export WBSWITCH_AUTH_DIR="$RUNNER_TEMP/auth"
          mkdir -p "$WBSWITCH_STORE" "$WBSWITCH_WORKBUDDY_HOME" "$WBSWITCH_AUTH_DIR"
          ./dist/wbswitch/wbswitch.exe --version
          ./dist/wbswitch/wbswitch.exe state --json --envelope | python -c "import json,sys; d=json.load(sys.stdin); assert d['ok'], d"

      - name: 侧车就位到桌面工程
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/sidecar
          cp -r dist/wbswitch desktop/src-tauri/sidecar/wbswitch

      - name: 前端构建
        working-directory: desktop
        run: |
          npm install
          npm run build
          node scripts/check-i18n-keys.mjs

      - name: Tauri 构建（NSIS）
        working-directory: desktop
        run: npx tauri build

      - name: 上传桌面安装包
        uses: actions/upload-artifact@v4
        with:
          name: SwitchSuite-setup
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: 发布 Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WorkBuddySwitch.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
