<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkBuddy Switch</title>
<style>
  :root {
    --bg:#0a0a0c; --panel:#121216; --panel2:#17171d; --panel3:#1e1e26;
    --border:#26262e; --soft:#1c1c23;
    --text:#e8e8ee; --dim:#8a8a99; --dim2:#5f5f6d;
    --accent:#5b8cff; --green:#3ecf8e; --red:#ff5f6d; --warn:#ffb020;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:var(--bg); color:var(--text); height:100vh; display:flex;
    flex-direction:column; overflow:hidden;
    font:14px/1.5 "Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;
    user-select:none;
  }
  header {
    display:flex; align-items:baseline; gap:8px;
    padding:18px 22px 10px;
  }
  h1 { font-size:21px; font-weight:700; letter-spacing:-.3px; }
  .ver { color:var(--dim2); font-size:12px; }
  .status { margin-left:auto; display:flex; align-items:center; gap:7px;
            font-size:12px; color:var(--dim); }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--dim2); }
  .dot.on { background:var(--green); }
  .dot.warn { background:var(--warn); }
  .dot.acc { background:var(--accent); }

  .toolbar { display:flex; gap:8px; padding:0 22px 12px; flex-wrap:wrap; }
  button {
    background:var(--panel3); color:var(--text); border:0; border-radius:5px;
    padding:7px 13px; font-size:12px; font-family:inherit; cursor:pointer;
  }
  button:hover { filter:brightness(1.28); }
  button:disabled { background:var(--panel2); color:var(--dim2); cursor:default;
                    filter:none; }
  button.primary { background:var(--accent); color:#fff; }
  button.ok { background:var(--green); color:#06231a; }
  button.danger { background:var(--panel3); color:var(--red); }
  button.right { margin-left:auto; }

  .sect { display:flex; align-items:center; gap:8px; padding:0 22px 6px;
          font-size:13px; font-weight:700; }
  .sect .count { color:var(--dim2); font-weight:400; font-size:12px; }
  .sect .home { margin-left:auto; color:var(--dim2); font-size:11px;
                font-family:Consolas,monospace; overflow:hidden;
                text-overflow:ellipsis; white-space:nowrap; max-width:60%; }

  .list { flex:1; overflow-y:auto; padding:0 16px; }
  .list::-webkit-scrollbar { width:9px; }
  .list::-webkit-scrollbar-thumb { background:var(--panel3); border-radius:5px; }
  .list::-webkit-scrollbar-track { background:var(--bg); }

  .card {
    background:var(--panel); border:1px solid var(--soft); border-radius:7px;
    padding:11px 13px; margin:5px 6px; display:flex; gap:12px; align-items:center;
  }
  .card.active { border-color:var(--accent); }
  .notch { width:4px; align-self:stretch; border-radius:2px; background:var(--accent); }
  .mid { flex:1; min-width:0; }
  .name-row { display:flex; align-items:center; gap:7px; }
  .name { font-weight:700; }
  .badge { font-size:10px; padding:1px 6px; border-radius:3px; }
  .badge.use { background:var(--accent); color:#fff; }
  .badge.pro { background:#2b3a63; color:#9db8ff; }
  .meta { color:var(--dim); font-size:12px; margin-top:3px; }
  .uid { color:var(--dim2); font-size:11px; font-family:Consolas,monospace;
         margin-top:2px; }
  .acts { display:flex; gap:7px; flex-shrink:0; }

  .empty {
    background:var(--panel); border:1px solid var(--soft); border-radius:7px;
    margin:10px 6px; padding:28px 16px; text-align:center;
  }
  .empty b { display:block; margin-bottom:5px; }
  .empty span { color:var(--dim); font-size:12px; }

  footer {
    background:var(--panel); height:92px; flex-shrink:0; padding:8px 14px;
    display:flex; flex-direction:column;
  }
  footer .lbl { color:var(--dim2); font-size:11px; margin-bottom:2px; }
  #log {
    flex:1; overflow-y:auto; color:var(--dim); font-size:11.5px;
    font-family:Consolas,monospace; white-space:pre-wrap;
  }
  #log .ok { color:var(--green); }
  #log .err { color:var(--red); }
  #log .warn { color:var(--warn); }
</style>
</head>
<body>

<header>
  <h1>WorkBuddy Switch</h1>
  <span class="ver" id="ver">v1.0.0</span>
  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="statusText">连接中…</span>
  </div>
</header>

<div class="toolbar">
  <button class="primary" id="btnCapture">保全当前登录</button>
  <button id="btnRefresh">刷新</button>
  <button id="btnDiag">诊断</button>
  <button id="btnBackups">备份与回滚</button>
  <button class="right" id="btnProc">启动 WorkBuddy</button>
</div>

<div class="sect">
  <span>账号</span>
  <span class="count" id="count">0</span>
  <span class="home" id="home"></span>
</div>

<div class="list" id="list"></div>

<footer>
  <div class="lbl">运行日志</div>
  <div id="log"></div>
</footer>

<script type="module">
import { invoke } from "@tauri-apps/api/core";

// ---------------------------------------------------------------------------
// 日志
// ---------------------------------------------------------------------------
const logEl = document.getElementById("log");

function log(msg, level = "info") {
  const t = new Date().toTimeString().slice(0, 8);
  const tag = { info: "  ", ok: "OK", err: "!!", warn: "~~" }[level] || "  ";
  const line = document.createElement("div");
  if (level !== "info") line.className = level;
  line.textContent = `${t} ${tag} ${msg}`;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

// ---------------------------------------------------------------------------
// 命令封装
// ---------------------------------------------------------------------------
let busy = false;

async function call(label, fn) {
  if (busy) { log("上一个操作还没结束", "warn"); return null; }
  busy = true;
  setButtons(false);
  try {
    const res = await fn();
    if (!res || res.ok !== true) {
      const err = (res && res.error) || "未知错误";
      log(`${label} 失败：${err}`, "err");
      return null;
    }
    return res.data !== null && res.data !== undefined ? res.data : res.raw_stdout;
  } catch (e) {
    log(`${label} 异常：${e}`, "err");
    return null;
  } finally {
    busy = false;
    setButtons(true);
  }
}

function setButtons(on) {
  for (const id of ["btnCapture", "btnRefresh", "btnDiag", "btnBackups"]) {
    document.getElementById(id).disabled = !on;
  }
  if (on) render(document._state);
}

// ---------------------------------------------------------------------------
// 渲染
// ---------------------------------------------------------------------------
const NOTCH = ["#5b8cff", "#3ecf8e", "#ffb020", "#c46bff", "#ff6b9d", "#39c5cf"];

function notchColor(seed) {
  let h = 0;
  for (const ch of seed || "x") h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return NOTCH[h % NOTCH.length];
}

function memText(s) {
  const n = (s && s.memory_bytes) || 0;
  return n ? `${(n / 1024).toFixed(1)}KB` : "-";
}

function render(state) {
  document._state = state;
  if (!state) return;

  const dot = document.getElementById("dot");
  const txt = document.getElementById("statusText");
  dot.className = "dot";

  if (state.running) {
    dot.classList.add("warn"); txt.textContent = "WorkBuddy 运行中";
  } else if (state.live_logged_in && state.unsaved_login) {
    dot.classList.add("acc"); txt.textContent = "检测到未入库登录";
  } else if (state.live_logged_in) {
    dot.classList.add("on"); txt.textContent = "登录态已保全";
  } else {
    txt.textContent = "未检测到登录态";
  }

  const accounts = state.accounts || [];
  document.getElementById("count").textContent = accounts.length;
  document.getElementById("home").textContent = state.workbuddy_home || "";

  document.getElementById("btnCapture").disabled =
    !state.live_logged_in || state.unsaved_login;
  const proc = document.getElementById("btnProc");
  proc.textContent = state.running ? "结束 WorkBuddy" : "启动 WorkBuddy";
  proc.disabled = !state.running && !state.client_path_ok;

  const list = document.getElementById("list");
  list.innerHTML = "";

  if (!accounts.length) {
    const box = document.createElement("div");
    box.className = "empty";
    box.innerHTML = '<b>还没有任何账号档案</b>' +
      '<span>点击左上角「保全当前登录」把当前账号存下来，之后就能一键换号了。</span>';
    list.appendChild(box);
    return;
  }

  for (const a of accounts) list.appendChild(card(a));
}

function btn(text, cls, onClick, disabled) {
  const b = document.createElement("button");
  b.textContent = text;
  if (cls) b.className = cls;
  if (disabled) b.disabled = true;
  b.onclick = onClick;
  return b;
}

function card(a) {
  const el = document.createElement("div");
  el.className = "card" + (a.is_active ? " active" : "");

  const notch = document.createElement("div");
  notch.className = "notch";
  notch.style.background = notchColor(a.id);
  el.appendChild(notch);

  const mid = document.createElement("div");
  mid.className = "mid";

  const nameRow = document.createElement("div");
  nameRow.className = "name-row";
  const nm = document.createElement("span");
  nm.className = "name";
  nm.textContent = a.name || "";
  nameRow.appendChild(nm);
  if (a.is_active) {
    const b = document.createElement("span");
    b.className = "badge use"; b.textContent = "使用中";
    nameRow.appendChild(b);
  }
  if (a.is_pro) {
    const b = document.createElement("span");
    b.className = "badge pro"; b.textContent = "PRO";
    nameRow.appendChild(b);
  }
  mid.appendChild(nameRow);

  const st = a.stats || {};
  const bits = [];
  if (a.identity_text) bits.push(a.identity_text);
  bits.push(`${st.sessions || 0} 会话`);
  bits.push(`记忆 ${memText(st)}`);
  bits.push(`${st.mcp_servers || 0} 连接器`);
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = bits.join(" · ");
  mid.appendChild(meta);

  const uid = document.createElement("div");
  uid.className = "uid";
  uid.textContent = `uid ${a.uid || ""}`;
  mid.appendChild(uid);
  el.appendChild(mid);

  const acts = document.createElement("div");
  acts.className = "acts";
  if (a.is_active) {
    acts.appendChild(btn("使用中", "ok", null, true));
  } else {
    acts.appendChild(btn("一键换号", "primary", () => doSwitch(a)));
  }
  acts.appendChild(btn("同步到此账号", "", () => doSync(a)));
  acts.appendChild(btn("重命名", "", () => doRename(a)));
  acts.appendChild(btn("删除", "danger", () => doDelete(a)));
  el.appendChild(acts);

  return el;
}

// ---------------------------------------------------------------------------
// 动作
// ---------------------------------------------------------------------------
async function refresh() {
  const data = await call("读取状态", () => invoke("get_state"));
  if (data) render(data);
}

async function doCapture() {
  const name = prompt("给这个账号起个名字：", "账号 " + new Date().toTimeString().slice(0, 5));
  if (!name) return;
  const d = await call("保全当前登录", () => invoke("capture", { name }));
  if (d) { log(`已建立档案：${d.name || name}`, "ok"); refresh(); }
}

async function doSwitch(a) {
  const desc = state_unsaved_note() +
    `将执行：保全当前登录 → 全量备份 → 同步本地数据到目标账号 → 写入登录身份 → 重启 WorkBuddy。\n\n确定切换到「${a.name}」？`;
  if (!confirm(desc)) return;
  const d = await call("一键换号", () => invoke("switch", { id: a.id }));
  if (d) {
    log(`已切换到 ${d.name || a.name}`, "ok");
    if (d.preserved_as) log(`自动保全原登录 → ${d.preserved_as}`, "warn");
    if (d.backup_tag) log(`备份 ${d.backup_tag}`);
    for (const w of d.warnings || []) log(w, "warn");
    log("若客户端要求重新登录，登录后数据已就位", "warn");
    refresh();
  }
}

function state_unsaved_note() {
  const s = document._state;
  return s && s.running ? "⚠️ WorkBuddy 正在运行，换号会先结束进程。\n\n" : "";
}

async function doSync(a) {
  if (!confirm(`把「${a.name}」的本地数据合并到当前登录的账号？\n（会自动备份，可回滚）`)) return;
  const d = await call("同步数据", () => invoke("sync", { id: a.id }));
  if (d) {
    for (const s of d.steps || []) {
      if (s.changed) log(`  ${s.name}: ${s.changed}`, s.ok ? "ok" : "err");
      else if (s.skipped) log(`  ${s.name}: 跳过`);
    }
    if (d.backup_tag) log(`备份 ${d.backup_tag}`);
    for (const w of d.warnings || []) log(w, "warn");
    log("同步完成，重启客户端后生效", "warn");
    refresh();
  }
}

async function doRename(a) {
  const name = prompt("新的名称：", a.name);
  if (!name || name === a.name) return;
  const d = await call("重命名", () => invoke("rename", { id: a.id, name }));
  if (d) { log(`已重命名为 ${name}`, "ok"); refresh(); }
}

async function doDelete(a) {
  if (!confirm(`删除档案「${a.name}」？\n\n只删除本工具的档案记录和快照，不会动 WorkBuddy 的真实数据。`)) return;
  const d = await call("删除档案", () => invoke("delete_account", { id: a.id }));
  if (d) { log(`已删除「${a.name}」`, "ok"); refresh(); }
}

async function doToggleProc() {
  const s = document._state || {};
  if (s.running) {
    if (!confirm("结束 WorkBuddy 进程？未保存的对话可能丢失。")) return;
    const d = await call("结束进程", () => invoke("kill_client"));
    if (d !== null) log("WorkBuddy 已结束", "ok");
  } else {
    const d = await call("启动客户端", () => invoke("launch_client"));
    if (d !== null) log("已启动 WorkBuddy", "ok");
  }
  refresh();
}

async function doDiag() {
  const d = await call("诊断", () => invoke("diagnose"));
  if (!d) return;
  log("── 路径 ──");
  for (const [k, v] of Object.entries(d.paths || {})) log(`  ${k} = ${v}`);
  log(`当前登录  ${d.live || "-"}`);
  log(`完整性    ${d.integrity}`);
  log("── 各 uid 数据量 ──");
  for (const uid of d.uids || []) {
    const flag = uid === d.live ? "CURRENT " : "";
    const reg = (d.registered || []).includes(uid) ? "registered" : "UNREGISTERED";
    log(`  ${uid}  sessions=${(d.counts || {})[uid] || 0}  autos=${(d.autos || {})[uid] || 0}  ${flag}${reg}`);
  }
}

async function doBackups() {
  const items = await call("读取备份", () => invoke("list_backups"));
  if (!items || !items.length) { log("还没有任何备份", "warn"); return; }
  log("── 备份列表 ──");
  for (const b of items) log(`  ${b.tag}  ${b.created_at || ""}  ${b.target_uid || ""}`);
  const tag = prompt("输入要回滚的备份标签（留空取消）：");
  if (!tag) return;
  if (!confirm(`回滚到 ${tag}？\n\n回滚前会先自动备份当前状态。`)) return;
  const d = await call("回滚", () => invoke("rollback", { tag }));
  if (d !== null) { log(`已回滚到 ${tag}`, "ok"); log("重启客户端后生效", "warn"); refresh(); }
}

// ---------------------------------------------------------------------------
// 绑定 & 启动
// ---------------------------------------------------------------------------
document.getElementById("btnCapture").onclick = doCapture;
document.getElementById("btnRefresh").onclick = refresh;
document.getElementById("btnDiag").onclick = doDiag;
document.getElementById("btnBackups").onclick = doBackups;
document.getElementById("btnProc").onclick = doToggleProc;

try {
  const env = await invoke("env_info");
  document.getElementById("ver").textContent =
    `v1.0.0 · ${env.platform}`;
  log(`引擎路径 ${env.engine_root}`);
  log(`Python   ${env.python}`);
} catch (e) {
  log(`环境自检失败：${e}`, "err");
}

log("WorkBuddy Switch 启动");
await refresh();
setInterval(() => { if (!busy) refresh(); }, 8000);
</script>

</body>
</html>
